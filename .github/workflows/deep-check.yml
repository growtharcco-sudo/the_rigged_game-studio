name: Deep check (no public posts)
on:
  push:
    branches: [main]
    paths: ["checks/deep.txt"]
  workflow_dispatch:
    inputs:
      skip_youtube: { description: "Skip the YouTube test upload", default: "0" }
jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests google-api-python-client google-auth pillow
      - env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SKIP_YT: ${{ inputs.skip_youtube }}
        run: |
          rc=0; python tools/deep_check.py > out.txt 2>&1 || rc=$?
          cat out.txt
          while IFS= read -r l; do [ -n "$l" ] && echo "::notice::$l"; done < out.txt
          exit $rc
