name: Render a Reel
# Renders in GitHub Actions (no Claude usage). Video, cover and sheet come back as an artifact.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec path, e.g. specs/003_roulette.json"
        required: true
      sheet_only:
        description: "Only make the check sheet"
        type: boolean
        default: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libegl1 libgl1 libfontconfig1
      - uses: actions/cache@v4
        with: { path: pipeline/models, key: kokoro-v1.0 }
      - run: pip install -q -r requirements.txt
      - name: Render
        run: |
          if [ "${{ inputs.sheet_only }}" = "true" ]; then python pipeline/make_reel.py "${{ inputs.spec }}" --sheet --allow-old-sources
          else python pipeline/make_reel.py "${{ inputs.spec }}" --allow-old-sources; fi
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: queue/
