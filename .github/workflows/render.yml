name: Render Reel
# Renders a spec into the final video in GitHub Actions (no Claude usage).
# Run it from the Actions tab with the spec id, e.g. 003_roulette. The video and cover come back as an artifact.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "spec id (file name in specs/ without .json)"
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install -q -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: pipeline/models
          key: kokoro-v1.0
      - run: python pipeline/make_reel.py "specs/${{ inputs.id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.id }}
          path: |
            queue/${{ inputs.id }}/video.mp4
            queue/${{ inputs.id }}/cover.png
            queue/${{ inputs.id }}/post.json
